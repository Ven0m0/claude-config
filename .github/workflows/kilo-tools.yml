name: kilo-tools
permissions:
  contents: read
on:
  push:
    branches: [main]
    paths:
      - "kilo-tools/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/kilo-tools.yml"
  pull_request:
    paths:
      - "kilo-tools/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/kilo-tools.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run kilo-tools tests
        run: bun test kilo-tools
