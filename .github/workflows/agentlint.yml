name: Lint LLM config files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Run claudelint
        run: uvx "claudelint" --strict .
  
      - name: Validate Claude Code agent configs
        uses: agent-sh/agnix@v0
        with:
          target: 'claude-code'

      - name: Lint AI context files
        run: npx -y @yawlabs/ctxlint --strict --yes
