name: Biome
permissions:
  contents: read
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check biome.json schema matches the installed Biome
        run: |
          installed=$(bunx @biomejs/biome --version | awk '{print $2}')
          pinned=$(jq -r '."$schema"' biome.json | awk -F/ '{print $5}')
          if [[ "$installed" != "$pinned" ]]; then
            echo "::error file=biome.json::\$schema pins $pinned but Biome $installed is installed; update the URL"
            exit 1
          fi
      - name: Run Biome check
        run: bunx @biomejs/biome check .
      - name: Run oxlint
        run: bunx oxlint .
